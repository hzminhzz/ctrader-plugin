name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore plugin
        run: dotnet restore src/PropRiskManager/Project/PropRiskManager.csproj
      - name: Restore tests
        run: dotnet restore tests/PropRiskManager.Tests/PropRiskManager.Tests.csproj
      - name: Build
        run: dotnet build src/PropRiskManager/Project/PropRiskManager.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/PropRiskManager.Tests/PropRiskManager.Tests.csproj --configuration Release --no-restore
      - name: Upload cTrader plugin
        uses: actions/upload-artifact@v4
        with:
          name: PropRiskManager-algo
          path: src/PropRiskManager/Project/bin/Release/net6.0/PropRiskManager.algo
          if-no-files-found: error
