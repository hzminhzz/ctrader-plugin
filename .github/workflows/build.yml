name: build

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore plugin
        run: dotnet restore src/PropRiskManager/PropRiskManager.csproj
      - name: Restore tests
        run: dotnet restore tests/PropRiskManager.Tests/PropRiskManager.Tests.csproj
      - name: Build
        run: dotnet build src/PropRiskManager/PropRiskManager.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/PropRiskManager.Tests/PropRiskManager.Tests.csproj --configuration Release --no-restore
